<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Power Roads 3D — Route visible V9</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#0b0f1a;--fg:#fff;--ac:#ff3d5a;--pn:rgba(15,20,35,.9);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#c{position:fixed;inset:0}
#hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:0 16px;font-weight:700;font-size:20px;text-shadow:0 2px 6px #000;pointer-events:none}
#gear{pointer-events:auto;width:42px;height:42px;padding:0;font-size:22px;border-radius:50%;background:rgba(15,20,35,.7);border:1px solid #3a4468;margin:0}
#menu{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(5,8,16,.5)}
.card{background:var(--pn);border:1px solid #2a3350;border-radius:18px;padding:26px 30px;text-align:center;width:min(340px,86vw);box-shadow:0 20px 60px rgba(0,0,0,.5);box-sizing:border-box}
h1{margin:0 0 6px;font-size:32px;letter-spacing:1px}
h1 span{color:var(--ac)}
h3{margin:14px 0 0;font-size:14px;color:#aab3cc;font-weight:600}
p{margin:6px 0 14px;color:#aab3cc;font-size:14px;line-height:1.6}
button{background:var(--ac);color:#fff;border:0;border-radius:12px;padding:14px 20px;font-size:18px;font-weight:700;cursor:pointer;width:100%;font-family:inherit}
button:active{transform:scale(.97)}
#card>button{margin-top:10px}
button.sec{background:#26304f;font-size:16px;padding:11px 20px}
.row{display:flex;gap:8px;margin:8px 0 4px}
.row button{padding:10px 4px;font-size:15px;background:#26304f;flex:1;margin:0}
.row button.on{background:var(--ac)}

/* ===== Écran d'accueil pro ===== */
.card{position:relative;z-index:1}
.card.home{background:linear-gradient(160deg,rgba(13,19,38,.7),rgba(7,10,22,.3));border:1px solid rgba(255,255,255,.08);box-shadow:0 20px 70px rgba(0,0,0,.18);width:min(520px,92vw);transform:translateY(-6vh);padding:30px;border-radius:24px}
#menu::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 65%,rgba(255,61,90,.2),transparent 55%),radial-gradient(ellipse at center,transparent 30%,rgba(5,8,16,.9) 100%);animation:glow 4s ease-in-out infinite alternate;pointer-events:none}
#menu::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 120px,rgba(255,255,255,.04) 120px 122px);animation:slide 2.5s linear infinite;pointer-events:none}
@keyframes glow{to{opacity:.6}}
@keyframes slide{to{background-position:-122px 0}}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes shine{to{background-position:300% 0}}
@keyframes pulse{50%{box-shadow:0 0 30px 6px rgba(255,61,90,.55)}}
.title{font-size:clamp(38px,12vw,68px);font-style:italic;font-weight:900;letter-spacing:2px;line-height:1;margin:0 0 10px;background:linear-gradient(90deg,#fff,#ff3d5a,#ffb347,#fff);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;animation:shine 5s linear infinite;filter:drop-shadow(0 0 16px rgba(255,61,90,.55))}
.title em{display:block;font-style:normal;font-size:.62em;letter-spacing:.45em}
.card:not(.still)>*:not(.title){animation:rise .5s both}
.card:not(.still)>:nth-child(2){animation-delay:.1s}.card:not(.still)>:nth-child(3){animation-delay:.2s}
.card:not(.still)>:nth-child(4){animation-delay:.3s}.card:not(.still)>:nth-child(5){animation-delay:.4s}.card:not(.still)>:nth-child(6){animation-delay:.5s}
button{transition:transform .15s,filter .2s}
button:hover{filter:brightness(1.12)}
#card button{text-transform:uppercase;letter-spacing:1.5px}
#card .row button{text-transform:none;letter-spacing:0}
button.main{font-size:24px;padding:18px 20px;letter-spacing:3px;background:linear-gradient(135deg,#ff3d5a,#ff7a3d)}
.card:not(.still)>button.main{animation:rise .5s both,pulse 2s .8s infinite}
.card.still>button.main{animation:pulse 2s infinite}
.two{display:flex;gap:10px;margin-top:10px}
.two button{margin:0;flex:1}
.best{color:#ffd27a;font-weight:700;margin:16px 0 4px}
.keys{font-size:12px;color:#8e98b8;line-height:1.6}
.sws{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:16px 0 6px}
.sw{width:52px;height:52px;border-radius:50%;padding:0;box-shadow:0 0 0 2px #3a4468}
.sw:hover{transform:scale(1.12)}
.sw.on{box-shadow:0 0 0 3px #fff,0 0 22px currentColor}
#gear{width:auto;height:auto;border-radius:12px;padding:8px 14px;font-size:15px;letter-spacing:1px}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}}
#dash{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 16px);width:min(360px,80vw);font-weight:800;text-shadow:0 2px 6px #000;pointer-events:none;visibility:hidden}
#rpmbar{height:12px;border-radius:8px;background:rgba(15,20,35,.7);border:1px solid #3a4468;overflow:hidden}
#rpmfill{display:block;height:100%;width:100%;background:linear-gradient(90deg,#27ae60,#f2c94c 65%,#ff3d5a);clip-path:inset(0 100% 0 0)}
#dash small{display:flex;justify-content:space-between;font-size:14px;margin-top:4px;color:#dfe6ff}
#nitroWrap{margin-top:8px;padding:7px 9px 8px;border:1px solid rgba(115,160,255,.3);border-radius:10px;background:rgba(8,15,35,.58);backdrop-filter:blur(6px)}
#nitroLabel{display:flex;justify-content:space-between;font-size:10px;letter-spacing:2px;color:#b8d9ff;margin-bottom:5px}
#nitroBar{height:7px;border-radius:8px;overflow:hidden;background:rgba(255,255,255,.13)}
#nitroFill{display:block;width:100%;height:100%;border-radius:8px;background:linear-gradient(90deg,#24c8ff,#6686ff);box-shadow:0 0 12px #24c8ff;transition:width .08s linear}
#nitroFill.empty{background:#667085;box-shadow:none}
.card{max-height:92vh;overflow-y:auto}
/* Sélection des circuits */
.trackChoices{display:grid;grid-template-columns:1fr;gap:8px;margin:12px 0}
.trackChoice{display:flex;align-items:center;gap:12px;text-align:left;background:rgba(255,255,255,.055)!important;border:1px solid rgba(255,255,255,.12)!important;padding:11px!important;border-radius:12px}
.trackChoice.on{border-color:#ff536a!important;background:rgba(255,61,90,.16)!important;box-shadow:inset 0 0 0 1px #ff536a}
.trackIcon{font-size:25px;width:38px;text-align:center}.trackChoice strong{display:block;font-size:14px}.trackChoice small{display:block;color:#aab3cc;font-size:11px;margin-top:2px}
/* Power Roads: garage et finition visuelle */
#c{background:linear-gradient(#101b37 0%,#e66a54 54%,#182238 55%,#080d18 100%)}
.card:not(.home){backdrop-filter:blur(14px);border-color:rgba(255,110,125,.35);box-shadow:0 24px 80px rgba(0,0,0,.55),0 0 32px rgba(255,61,90,.12)}
.sws{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.sw{width:100%;height:44px;border-radius:12px;position:relative;border:2px solid rgba(255,255,255,.15)}
.sw.on{border-color:#fff;box-shadow:0 0 0 2px var(--ac),0 0 20px currentColor}
.carName{font-weight:800;color:#ffd27a;margin:8px 0 12px;font-size:14px}
#card button:focus-visible{outline:3px solid #fff;outline-offset:3px}
#impact{position:fixed;left:50%;top:22%;transform:translateX(-50%);padding:10px 18px;border-radius:12px;background:rgba(255,61,90,.9);font-weight:900;letter-spacing:2px;text-shadow:0 2px 4px #000;opacity:0;pointer-events:none;z-index:4;transition:opacity .15s}
#impact.show{opacity:1}
#raceHud{position:fixed;top:58px;left:50%;transform:translateX(-50%);padding:7px 13px;border-radius:12px;background:rgba(8,13,28,.72);border:1px solid rgba(255,255,255,.16);font-size:12px;font-weight:900;letter-spacing:1px;text-shadow:0 2px 5px #000;pointer-events:none;display:none;white-space:nowrap}
#countdown{position:fixed;inset:0;display:none;place-items:center;font-size:clamp(70px,20vw,150px);font-weight:1000;font-style:italic;color:#fff;text-shadow:0 0 30px #ff3d5a,0 8px 0 rgba(0,0,0,.25);pointer-events:none;z-index:5}
.raceTag{display:inline-block;padding:5px 10px;border-radius:999px;background:rgba(45,156,219,.14);border:1px solid rgba(45,156,219,.4);color:#8fd9ff;font-size:10px;font-weight:900;letter-spacing:2px;margin:3px 0 10px}
#damage{color:#ff8b9b;font-size:11px;letter-spacing:1px;margin-top:4px;text-align:center}
#menu{backdrop-filter:blur(2px)}


/* Garage v2 : présentation des véhicules et panneaux de caractéristiques */
.card.home{background:linear-gradient(145deg,rgba(12,18,36,.94),rgba(18,12,29,.88));border:1px solid rgba(255,95,115,.45);box-shadow:0 25px 90px rgba(0,0,0,.48),inset 0 1px rgba(255,255,255,.07)}
.card.home .best{padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.08)}
.card.home .keys{margin-top:12px}
.card.car{width:min(460px,92vw);background:linear-gradient(155deg,rgba(13,20,40,.97),rgba(8,11,24,.96));border:1px solid rgba(255,80,105,.45)}
.garageTag{display:inline-block;margin:4px auto 10px;padding:5px 10px;border-radius:999px;background:rgba(255,61,90,.14);border:1px solid rgba(255,61,90,.4);color:#ff9baa;font-size:10px;font-weight:900;letter-spacing:2px}
.carShowcase{display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;padding:14px;margin:10px 0 12px;border-radius:16px;background:linear-gradient(120deg,rgba(255,255,255,.075),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.09)}
.carBadge{width:78px;height:62px;flex:0 0 78px;display:grid;place-items:center;border-radius:14px;background:radial-gradient(circle,rgba(255,255,255,.12),rgba(255,255,255,.015));font-size:40px;filter:drop-shadow(0 8px 10px rgba(0,0,0,.35))}
.carDetails{flex:1;min-width:0}.carDetails strong{display:block;font-size:20px;line-height:1.2}.carDetails small{display:block;color:#aab3cc;font-size:11px;margin-top:5px}
.specs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 14px;text-align:left}.spec{padding:9px;border-radius:11px;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.07)}.spec label{display:block;color:#aab3cc;font-size:10px;letter-spacing:1px}.spec b{display:block;margin:5px 0;font-size:12px}.specLine{height:4px;border-radius:5px;background:rgba(255,255,255,.1);overflow:hidden}.specLine i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,#ff3d5a,#ffb347)}
.sw{transition:transform .16s,box-shadow .16s}.sw:hover{transform:translateY(-2px) scale(1.04)}
#menu .card button.sec{border:1px solid rgba(255,255,255,.07)}
@media(max-height:680px){.card.home{transform:none;padding:18px}.carShowcase{padding:9px;margin:6px 0}.specs{margin:7px 0}.sw{height:36px}}



/* Commandes tactiles pour téléphones et tablettes */
#touchControls{display:none;position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);z-index:8;justify-content:space-between;align-items:flex-end;padding:0 14px;gap:12px;pointer-events:none;box-sizing:border-box}
.touchGroup{display:grid;gap:9px;pointer-events:auto;touch-action:none}
.touchSteer{grid-template-columns:repeat(2, minmax(54px, 16vw))}
.touchPedals{grid-template-columns:minmax(62px,18vw);}
.touchBtn{width:100%;min-height:58px;padding:8px 5px;border-radius:17px;border:1px solid rgba(255,255,255,.35);background:rgba(12,20,42,.78);box-shadow:0 5px 18px rgba(0,0,0,.32);font-size:24px;font-weight:900;backdrop-filter:blur(8px);touch-action:none;-webkit-tap-highlight-color:transparent;user-select:none}
.touchBtn span{display:block;font-size:9px;letter-spacing:.5px;margin-top:2px}
.touchBtn.gas{background:linear-gradient(145deg,rgba(20,145,82,.94),rgba(8,89,55,.94));min-height:70px}
.touchBtn.nitro{background:linear-gradient(145deg,rgba(18,122,215,.94),rgba(36,58,156,.94));min-height:48px;font-size:20px}
.touchBtn.brake{background:linear-gradient(145deg,rgba(180,45,64,.92),rgba(108,23,40,.94));min-height:48px;font-size:20px}
.touchBtn.pressed{filter:brightness(1.35);transform:scale(.94);box-shadow:0 0 0 2px rgba(255,255,255,.7),0 0 18px rgba(255,255,255,.18)}
body.playing #touchControls{display:flex}
@media (hover:none), (max-width:760px){
  #dash{bottom:calc(env(safe-area-inset-bottom,0px) + 105px);width:34vw;min-width:130px;max-width:220px;left:50%}
  #hud{font-size:15px;padding:0 10px}
  #gear{font-size:12px;padding:7px 9px}
  #raceHud{top:53px;font-size:10px}
  .touchBtn{min-height:54px}
  .touchBtn.gas{min-height:64px}
}

</style>
</head>
<body>
<div id="c"></div>

<div id="dash"><div id="rpmbar"><i id="rpmfill"></i></div><small><span id="gr">G1</span><span id="rp">0 RPM</span></small><div id="nitroWrap"><div id="nitroLabel"><span>NITRO</span><span id="nitroPct">100%</span></div><div id="nitroBar"><i id="nitroFill"></i></div></div></div>
<div id="impact">IMPACT!</div><div id="raceHud">POSITION 1/4 · 0%</div><div id="countdown">3</div>

  </div>
</div>
<div id="menu"><div class="card" id="card"></div></div>

<script>
const $=id=>document.getElementById(id);
const ls={g:k=>{try{return localStorage.getItem(k)}catch(e){return null}},s:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};

// ---------- Langues ----------
const L={
fr:{play:'Jouer',best:'Meilleur score',tip:`← → / A D ou touche la moitié gauche/droite de l'écran`,sub:'Esquive le trafic et bats ton record !',crash:'Crash !',dist:'Distance',record:'Record',again:'Rejouer',settings:'Paramètres',quality:'Qualité',lang:'Langue',low:'Basse',med:'Moyenne',high:'Haute',back:'Retour',resume:'Reprendre',m:'m',kmh:'km/h'},
en:{play:'Play',best:'Best score',tip:'← → / A D or touch the left/right half of the screen',sub:'Dodge the traffic and beat your record!',crash:'Crash!',dist:'Distance',record:'Record',again:'Play again',settings:'Settings',quality:'Quality',lang:'Language',low:'Low',med:'Medium',high:'High',back:'Back',resume:'Resume',m:'m',kmh:'km/h'},
ar:{play:'العب',best:'أفضل نتيجة',tip:'استخدم ← → أو A D أو المس نصف الشاشة الأيمن أو الأيسر',sub:'تفادَ السيارات وحطّم رقمك القياسي!',crash:'تحطّمت!',dist:'المسافة',record:'الرقم القياسي',again:'أعد اللعب',settings:'الإعدادات',quality:'الجودة',lang:'اللغة',low:'منخفضة',med:'متوسطة',high:'عالية',back:'رجوع',resume:'استئناف',m:'م',kmh:'كم/س'}
};
Object.assign(L.fr,{tip:'← → / A D : tourner · P / Échap : pause · R : recommencer<br>Mobile : touche la moitié gauche ou droite',restart:'Recommencer',menu:'Menu',car:'Voiture',paused:'Pause'});
Object.assign(L.en,{tip:'← → / A D: steer · P / Esc: pause · R: restart<br>Mobile: touch the left or right half',restart:'Restart',menu:'Menu',car:'Car',paused:'Pause'});
Object.assign(L.ar,{tip:'← → / A D: التوجيه · P / Esc: إيقاف مؤقت · R: إعادة<br>الجوال: المس النصف الأيمن أو الأيسر',restart:'إعادة',menu:'القائمة',car:'السيارة',paused:'إيقاف'});
Object.assign(L.fr,{tip:'← → / A D : tourner · ↑ / W / Z : accélérer · ↓ / S : freiner<br>P / Échap : pause · R : recommencer',sound:'Son',on:'Activé',off:'Coupé'});
Object.assign(L.en,{tip:'← → / A D: steer · ↑ / W: accelerate · ↓ / S: brake<br>P / Esc: pause · R: restart',sound:'Sound',on:'On',off:'Off'});
Object.assign(L.ar,{tip:'← → / A D: التوجيه · ↑ / W: تسريع · ↓ / S: فرامل<br>P / Esc: إيقاف مؤقت · R: إعادة',sound:'الصوت',on:'مفعّل',off:'متوقف'});
Object.assign(L.fr,{tip:'← → / A D : tourner · ↑ / W / Z : accélérer · ↓ / S : freiner<br>Espace : frein à main (dérapage) · P / Échap : pause · R : recommencer'});
Object.assign(L.en,{tip:'← → / A D: steer · ↑ / W: accelerate · ↓ / S: brake<br>Space: handbrake (drift) · P / Esc: pause · R: restart'});
Object.assign(L.ar,{tip:'← → / A D: التوجيه · ↑ / W: تسريع · ↓ / S: فرامل<br>Shift: نيترو · Space: انزلاق · P: إيقاف · R: إعادة',carNames:['Flame','Azure','Solar','Volt','Ghost','Neon','Inferno','Aqua','Violet','Racing'],garage:'اختر سيارتك'});
Object.assign(L.fr,{tip:'← → / A D : tourner · ↑ / W / Z : accélérer · ↓ / S : freiner<br>SHIFT : nitro · Espace : dérapage · P : pause · R : recommencer',carNames:['Flamme','Azur','Solar','Volt','Ghost','Néon','Inferno','Aqua','Violet','Racing'],garage:'Choisis ta voiture'});
Object.assign(L.en,{tip:'← → / A D: steer · ↑ / W: accelerate · ↓ / S: brake<br>SHIFT: nitro · Space: drift · P: pause · R: restart',carNames:['Flame','Azure','Solar','Volt','Ghost','Neon','Inferno','Aqua','Violet','Racing'],garage:'Choose your car'});
let lang=ls.g('tr3d_l');if(!L[lang])lang=L[(navigator.language||'fr').slice(0,2)]?(navigator.language||'fr').slice(0,2):'en';
let quality=ls.g('tr3d_q');if(!['low','med','high'].includes(quality))quality='med';
let best=+ls.g('tr3d_best')||0;
const T=()=>L[lang];
const TRACKS=[
 {id:'coast',name:'Côte ensoleillée',desc:'Circuit répétable · virages doux · mer turquoise',icon:'🌊',curve:1.0,period:185,road:0xeeeeee,ground:0x8bbf8a,fog:0x83b8c2,tree:0x347d63,sky:['#214d79','#79c4d5','#f5c49a']},
 {id:'canyon',name:'Canyon rouge',desc:'Circuit répétable · grandes courbes · roches rouges',icon:'🏜️',curve:1.55,period:155,road:0xe2d7c8,ground:0xb8754f,fog:0xc77c67,tree:0x8b563c,sky:['#34284f','#d87868','#f4b77f']},
 {id:'forest',name:'Forêt alpine',desc:'Circuit répétable · virages serrés · sapins',icon:'🌲',curve:2.0,period:130,road:0xd9dedf,ground:0x416d48,fog:0x9ab5a8,tree:0x174b31,sky:['#2c5367','#a8c9c3','#d8e5cf']}
];
let trackId=ls.g('pr3d_track')||'coast';
if(!TRACKS.some(t=>t.id===trackId))trackId='coast';
const track=()=>TRACKS.find(t=>t.id===trackId)||TRACKS[0];
// Tracé de circuit répétable : les virages se répètent à chaque tour,
// avec une entrée, un enchaînement de courbes et une dernière courbe de retour.
function curveAt(z,dist=S.dist||0){
 const tr=track();
 const u=(((dist-z*.3)%LAP_LENGTH)+LAP_LENGTH)%LAP_LENGTH/LAP_LENGTH;
 const a=u*Math.PI*2;
 const profile=Math.sin(a-.35)+.42*Math.sin(2*a+1.1)+.18*Math.sin(3*a-.8);
 return tr.curve*profile;
}


// ---------- Rendu ----------
let ren;
try{ren=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'})}
catch(e){document.body.innerHTML='<p style="padding:30px;font-family:sans-serif">WebGL not supported / WebGL non supporté</p>';throw e}
ren.shadowMap.enabled=true;ren.shadowMap.type=THREE.PCFShadowMap;
$('c').appendChild(ren.domElement);
const scene=new THREE.Scene();
const FOG=0xd9887f;
scene.fog=new THREE.Fog(FOG,40,180);
const cam=new THREE.PerspectiveCamera(66,1,.1,320);
const mat=c=>new THREE.MeshLambertMaterial({color:c});

 const t=T();
 card(`<h1>🗺️ Circuits</h1><p>Choisis l'environnement de ta prochaine course.</p><div class="trackChoices">${TRACKS.map(tr=>`<button class="trackChoice${tr.id===trackId?' on':''}" data-track="${tr.id}"><span class="trackIcon">${tr.icon}</span><span><strong>${tr.name}</strong><small>${tr.desc}</small></span></button>`).join('')}</div><button class="sec" id="bk">${t.back}</button>`,'tracks');
 document.querySelectorAll('[data-track]').forEach(b=>b.onclick=()=>{trackId=b.dataset.track;ls.s('pr3d_track',trackId);applyTrack();showTracks()});
 $('bk').onclick=home;
}
function home(){
  const t=T();clearTraffic();$('raceHud').style.display='none';$('countdown').style.display='none';S.run=false;S.paused=false;S.attract=true;S.dist=0;S.speed=0;S.x=0;S.vx=0;S.slide=0;S.shake=0;renderHUD();
  $('hud').style.visibility=$('dash').style.visibility='hidden';
  card(`<h1 class="title">POWER<em>ROADS</em></h1><p>${t.sub}</p><div class="garageTag">3D ARCADE RACING · NITRO · DRIFT</div><div class="raceTag">🏁 3 TOURS · 3 RIVAUX IA</div><button class="main" id="go">🏁 ${t.play}</button><div class="two"><button class="sec" id="cr">🚗 ${t.car}</button><button class="sec" id="tr">🗺️ Circuit</button></div><div class="two"><button class="sec" id="st">⚙ ${t.settings}</button></div><div class="best">${t.best} : ${best} ${t.m}</div><div class="keys">${t.tip}</div>`,'home');
  $('go').onclick=reset;$('cr').onclick=showCars;$('tr').onclick=showTracks;$('st').onclick=showSettings;
}
function showCars(){
  const t=T(),meta=CAR_META[carIdx],names=t.carNames||CAR_META.map(c=>c.name);
  const bar=(label,val)=>`<div class="spec"><label>${label}</label><b>${val}/100</b><div class="specLine"><i style="width:${val}%"></i></div></div>`;
  card(`<h1>🚘 ${t.car}</h1><div class="garageTag">POWER ROADS · GARAGE</div><div class="carShowcase"><div class="carBadge" id="carBadge" style="color:#${CARS[carIdx].toString(16).padStart(6,'0')}">🏎️</div><div class="carDetails"><strong id="carName">${names[carIdx]||meta.name}</strong><small id="carType">${meta.type} · MODÈLE ${String(carIdx+1).padStart(2,'0')}</small><small>Couleur et style sélectionnés</small></div></div><p>${t.garage||t.car} · Choisis ta voiture préférée</p><div class="sws">${CARS.map((c,i)=>{const h='#'+c.toString(16).padStart(6,'0');return `<button title="${names[i]||'Car '+(i+1)}" class="sw${i===carIdx?' on':''}" data-c="${i}" aria-label="${names[i]||t.car+' '+(i+1)}" style="background:${h};color:${h}"></button>`}).join('')}</div><div class="specs" id="specs">${bar('VITESSE',meta.speed)}${bar('DIRECTION',meta.handling)}${bar('ADHÉRENCE',meta.grip)}</div><button class="main" id="driveNow">▶ ${t.play}</button><button class="sec" id="bk">${t.back}</button>`,'car');
  const update=i=>{
    const m=CAR_META[i],n=names[i]||m.name;
    $('carName').textContent=n;$('carType').textContent=m.type+' · MODÈLE '+String(i+1).padStart(2,'0');
    $('carBadge').style.color='#'+CARS[i].toString(16).padStart(6,'0');
    $('specs').innerHTML=bar('VITESSE',m.speed)+bar('DIRECTION',m.handling)+bar('ADHÉRENCE',m.grip);
  };
  document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{setCar(+b.dataset.c);document.querySelectorAll('[data-c]').forEach(x=>x.classList.toggle('on',x===b));update(carIdx)});
  $('driveNow').onclick=reset;$('bk').onclick=home;
}
function reset(){
  $('hud').style.visibility=$('dash').style.visibility='visible';$('raceHud').style.display='block';$('countdown').style.display='grid';audio();clearTraffic();kc();Object.assign(S,{run:true,paused:false,attract:false,speed:0,dist:0,x:0,vx:0,spawn:1.6,shake:0,time:0,slide:0,nitro:100,nitroActive:false,hits:0,hitFlash:0,countdown:3});createRivals();hide();renderHUD();updateRaceHud();
}
function crash(){
  const t=T(),d=Math.floor(S.dist);S.run=false;S.shake=1;kc();$('raceHud').style.display='none';$('countdown').style.display='none';
  if(d>best){best=d;ls.s('tr3d_best',best)}
  showMenu(t.crash,`${t.dist} : ${d} ${t.m}<br>🏁 Position : ${raceRank()}/4<br>⏱ ${fmt(S.time)}<br>${t.record} : ${best} ${t.m}`,t.again,reset);
}
function finishRace(){
  if(!S.run)return;S.run=false;kc();$('raceHud').style.display='none';$('countdown').style.display='none';const pos=raceRank(),d=Math.floor(S.dist);if(d>best){best=d;ls.s('tr3d_best',best)}
  const title=pos===1?'🏆 VICTOIRE !':'🏁 COURSE TERMINÉE';const sub=`Position finale : ${pos}/4<br>${TOTAL_LAPS} tours terminés · ${d} m<br>Temps : ${fmt(S.time)}<br>Record : ${best} m`;showMenu(title,sub,'Rejouer',reset);
}
function resume(){if(S.run&&S.paused){S.paused=false;hide()}}
function showPause(){
  const t=T();
  card(`<h1>${t.paused}</h1><button class="main" id="rs">▶ ${t.resume}</button><button class="sec" id="rt">↻ ${t.restart}</button><button class="sec" id="st">⚙ ${t.settings}</button><button class="sec" id="hm">⌂ ${t.menu}</button>`,'pause');
  $('rs').onclick=resume;$('rt').onclick=reset;$('st').onclick=showSettings;$('hm').onclick=home;
}
function pauseToggle(){
  if(S.run&&!S.paused){S.paused=true;kc();showPause()}
  else resume();
}
$('gear').onpointerdown=e=>e.stopPropagation();
$('gear').onclick=()=>{$('gear').blur();pauseToggle()};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&S.run&&!S.paused)pauseToggle()});
addEventListener('blur',kc);
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(k==='arrowleft'||k==='a'||k==='q')K.l=1;
  if(k==='arrowright'||k==='d')K.r=1;
  if(k==='arrowup'||k==='w'||k==='z')K.u=1;
  if(k==='arrowdown'||k==='s')K.d=1;
  if(k===' ')K.h=1;
  if(k==='shift')K.nitro=1;
  if(!e.repeat){
    if(k==='escape'||k==='p')pauseToggle();
    else if(k==='r'&&(S.run||S.dist>0))reset();
    else if((k==='enter'||k===' ')&&$('menu').style.display!=='none'&&!(document.activeElement&&document.activeElement.tagName==='BUTTON')){const b=$('go')||$('rs');if(b){e.preventDefault();b.click()}}
  }
});
addEventListener('keyup',e=>{
  const k=e.key.toLowerCase();
  if(k==='arrowleft'||k==='a'||k==='q')K.l=0;
  if(k==='arrowright'||k==='d')K.r=0;
  if(k==='arrowup'||k==='w'||k==='z')K.u=0;
  if(k==='arrowdown'||k==='s')K.d=0;
  if(k===' ')K.h=0;
  if(k==='shift')K.nitro=0;
});
// Boutons tactiles : maintenir le bouton pour accélérer, tourner, freiner ou utiliser le nitro.
document.querySelectorAll('[data-touch]').forEach(btn=>{
  const key=btn.dataset.touch;
  const set=(value,e)=>{
    if(e){e.preventDefault();e.stopPropagation()}
    K[key]=value;
    btn.classList.toggle('pressed',!!value);
  };
  btn.addEventListener('pointerdown',e=>{
    if(!S.run||S.paused)return;
    set(1,e);
    try{btn.setPointerCapture(e.pointerId)}catch(_){ }
  });
  const release=e=>set(0,e);
  btn.addEventListener('pointerup',release);
  btn.addEventListener('pointercancel',release);
  btn.addEventListener('lostpointercapture',()=>set(0));
  btn.addEventListener('contextmenu',e=>e.preventDefault());
});

addEventListener('pointerdown',e=>{
  if(!S.run||S.paused||(e.target.closest&&e.target.closest('button')))return;
  K.pl=e.clientX<innerWidth/2?1:0;K.pr=1-K.pl;
});
['pointerup','pointercancel'].forEach(n=>addEventListener(n,()=>{K.pl=K.pr=0}));

// ---------- Boucle ----------
const clock=new THREE.Clock();
let frame=0;
function loop(){
  requestAnimationFrame(loop);
  const dt=Math.min(clock.getDelta(),.05);
  let sp=0;const playing=S.run&&!S.paused;skidLvl=0;smokeOn=false;
  if(playing){
    if(S.countdown>0){S.countdown=Math.max(0,S.countdown-dt);$('countdown').textContent=S.countdown>2?'3':S.countdown>1?'2':S.countdown>.15?'1':'GO!';if(S.countdown<=0){$('countdown').style.display='none';S.speed=30;} }
    const racing=S.countdown<=0;
    S.hitFlash=Math.max(0,S.hitFlash-dt);
    const carSpec=CAR_META[carIdx]||CAR_META[0];
    const carSpeed=0.9+carSpec.speed/500;
    const cruise=Math.min((30+S.dist*.012)*carSpeed,95*carSpeed),thr=racing?((K.u?1:0)-(K.d?1:0)):0;
    S.nitroActive=!!K.nitro&&S.nitro>0&&thr>=0;
    if(S.nitroActive)S.nitro=Math.max(0,S.nitro-30*dt);else S.nitro=Math.min(100,S.nitro+8*dt);
    const targetSpeed=!racing?0:(thr<0?12:cruise+(thr>0?25:0)+(S.nitroActive?48:0));
    S.speed+=(targetSpeed-S.speed)*Math.min(dt*(thr<0?3:S.nitroActive?2.4:thr>0?1.2:1.5),1);
    const hb=!!K.h&&S.speed>30;
    if(hb)S.speed-=22*dt;
    if(S.speed<12)S.speed=12;
    sp=S.speed;S.time+=dt;dash();
    if(racing)S.dist+=sp*dt*.3;
    if(racing){rivals.forEach(r=>{
      r.phase+=dt;r.think-=dt;
      // L'IA choisit sa trajectoire régulièrement et tente de dépasser le joueur.
      if(r.think<=0){r.think=.45+Math.random()*.65;const ahead=r.m.position.z<0;let lane=r.baseLane+Math.sin(r.phase*.55+r.style)*1.15;
        if(Math.abs(r.m.position.z)<20&&Math.abs(r.lane-S.x)<2.4)lane=S.x+(r.lane<=S.x?-2.6:2.6);
        if(ahead&&r.progress<S.dist+35)lane+=(r.style%2?1:-1)*1.2;
        r.targetLane=Math.max(-4.35,Math.min(4.35,lane));
      }
      r.lane+=(r.targetLane-r.lane)*Math.min(dt*(2.0+r.skill),1);
      const gap=S.dist-r.progress;const pace=gap>90?1.13:gap>25?1.05:gap< -70?.91:1;
      const curveStress=Math.min(.12,Math.abs(curveAt(r.m.position.z+8)-curveAt(r.m.position.z-8))*.035);
      const rivalSpeed=r.speed*pace*(1-curveStress);r.progress+=rivalSpeed*dt*.3;
      r.m.position.x=curveAt(r.m.position.z)+r.lane;r.m.position.z+=(sp-rivalSpeed)*dt;
      r.m.rotation.y=-(r.targetLane-r.lane)*.035-Math.sin(r.phase*.8)*.045;
      if(r.m.position.z>13)r.m.position.z=-180-Math.random()*25;if(r.m.position.z<-220)r.m.position.z=10;
    });updateRaceHud();if(S.dist>=RACE_LENGTH){finishRace();return;}}
    const tgt=((K.r||K.pr)?1:0)-((K.l||K.pl)?1:0);
    const handling=(.78+carSpec.handling/100*.42)*(0.92+carSpec.grip/100*.08);
    const speedFactor=.82+Math.min(S.speed,100)/260;
    const steerPower=(hb?15:11.5)*handling*speedFactor;
    S.vx+=(tgt*steerPower-S.vx)*Math.min(dt*(hb?2.8:5.2),1);
    if(!tgt&&!hb)S.vx*=Math.max(0,1-dt*1.35);
    S.slide=(S.slide||0)+((hb?tgt*(.78-carSpec.grip/300):0)-(S.slide||0))*Math.min(dt*4.8,1);
    S.x=Math.max(-5.15,Math.min(5.15,S.x+S.vx*dt));
    const skid=hb||(thr<0&&S.speed>55);
    skidLvl=skid?1:(thr<0&&S.speed>25?.3:0);
    M.tailP.color.setHex(thr<0?0xff3b3b:0x7a1414);
    if(skid&&fxN>0){smokeOn=true;skT-=dt;if(skT<=0){skT=.04;addSkid(S.x-.9);addSkid(S.x+.9)}}
    S.spawn-=dt;
    if(S.spawn<=0){
      S.spawn=Math.max(.4,1.1-S.dist/4000);
      const truck=Math.random()<.18,x=Math.random()*10-5;
      const free=!traffic.some(t=>Math.abs(t.m.position.z-spawnZ)<16&&Math.abs(t.laneX-x)<3.6);
      if(free){
        const m=mkCar(truck?0x3a6ea5:colors[Math.random()*colors.length|0],truck,false);
        m.position.set(curveAt(spawnZ)+x,0,spawnZ);scene.add(m);
        traffic.push({m,laneX:x,v:truck?14+Math.random()*4:18+Math.random()*8,hl:m.userData.hl,hw:m.userData.hw});
      }
    }
    for(let i=traffic.length-1;i>=0;i--){
      const t=traffic[i],p=t.m.position;
      p.z+=(sp-t.v)*dt;p.x=curveAt(p.z)+t.laneX;
      if(p.z>14||p.z<spawnZ-30){scene.remove(t.m);traffic.splice(i,1);continue}
      if(Math.abs(p.z)<t.hl+1.85&&Math.abs(t.laneX-S.x)<t.hw+.78&&S.hitFlash<=0){
        scene.remove(t.m);traffic.splice(i,1);S.hits++;S.hitFlash=1.15;S.speed=Math.max(16,S.speed*.62);S.shake=Math.min(1.8,.7+S.hits*.25);S.vx+=(S.x<t.laneX?-1:1)*3.2;
        const impact=$('impact');impact.textContent='IMPACT!  '+S.hits+'/3';impact.classList.add('show');
        setTimeout(()=>impact.classList.remove('show'),650);
        if(S.hits>=3){crash();break}
      }
    }
    if(++frame%3===0)renderHUD();
  }else {S.nitroActive=false;if(S.attract)sp=22;}
  // défilement
  roadT.offset.y=(roadT.offset.y+sp*dt/24)%1;
  grassT.offset.y=(grassT.offset.y+sp*dt/20)%1;
  roadSegments.forEach(seg=>{seg.position.z+=sp*dt;if(seg.position.z>8)seg.position.z-=ROAD_SEG_LEN*ROAD_SEG_COUNT;seg.position.x=curveAt(seg.position.z);});
  slots.forEach(g=>{g.position.z+=sp*dt;if(g.position.z>12)g.position.z-=240;g.position.x=curveAt(g.position.z)+g.userData.offsetX;});
  skids.forEach(m=>{if(m.visible){m.position.z+=sp*dt;if(m.position.z>14)m.visible=false}});
  if(fxN>0){
    for(let i=0;i<fxN;i++){fxp[i*3+2]+=sp*dt*1.4;if(fxp[i*3+2]>10)fxr(i,-170)}
    fxg.attributes.position.needsUpdate=true;
    fxm.opacity=Math.min(Math.max((sp-45)/50,0),1)*.55;
  }
  if(fxN>0){
    for(let i=0;i<SMN;i++)if(sml[i]>0){sml[i]-=dt;smp[i*3+1]+=1.3*dt;smp[i*3+2]+=sp*dt*.9;if(sml[i]<=0)smp[i*3+1]=-50}
    if(smokeOn)[-.9,.9].forEach(dx=>{const i=smI=(smI+1)%SMN;smp[i*3]=S.x+dx+(Math.random()-.5)*.4;smp[i*3+1]=.35;smp[i*3+2]=1.4;sml[i]=.7});
    smg.attributes.position.needsUpdate=true;
  }
  // La ligne d'arrivée revient à chaque tour; sa position suit la progression.
  const untilFinish=LAP_LENGTH-(S.dist%LAP_LENGTH);
  finishGroup.position.z=-untilFinish*.3;
  finishGroup.position.x=curveAt(finishGroup.position.z);
  finishGroup.visible=finishGroup.position.z>-190&&finishGroup.position.z<12;
  // joueur + caméra
  player.position.x=curveAt(0)+S.x;player.rotation.y=-S.vx*.02-(S.slide||0);player.rotation.z=-S.vx*.008-(S.slide||0)*.15;
  player.scale.setScalar(S.nitroActive?1.025:1);
  if(S.hitFlash>0&&frame%6<3)player.visible=false;else player.visible=true;
  sun.position.set(S.x+12,22,-4);sun.target.position.set(S.x,0,-14);
  const tx=curveAt(-12)+S.x*.7,sh=S.shake;
  cam.fov=66+Math.min(sp,95)/95*12;cam.updateProjectionMatrix();
  cam.position.set(tx+(Math.random()-.5)*sh*.35,4.2+(Math.random()-.5)*sh*.25,9.2);
  cam.lookAt(tx,0.55,-10);cam.rotateZ(-S.vx*.004);
  S.shake=Math.max(0,sh-dt*2);
  if((ef=(ef+1)%3)===0)engine(rpmNow,playing,skidLvl);
  ren.render(scene,cam);
}

applyQ();applyTrack();applyLang();home();loop();
</script>
